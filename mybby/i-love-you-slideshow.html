<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #f3ece4;
    --ink-dim:  #cabdb2;
    --void:     #0c0a09;
    --gold:     #c9a15a;
    --crimson:  #b3123a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  /* ============================================================
     BACKGROUND — full page rose photo, darkened for readability
     ============================================================ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.1);
    animation: kenburns 20s ease-in-out infinite alternate;
    filter: saturate(1.05) contrast(1.02);
  }

  @keyframes kenburns {
    0%   { transform: scale(1.1) translate(0,0); }
    100% { transform: scale(1.2) translate(-1.5%, -1%); }
  }

  .bg::after {
    /* dark scrim so text/box stay readable over the rose */
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(12,10,9,0.55) 0%, rgba(12,10,9,0.75) 45%, rgba(12,10,9,0.9) 100%);
  }

  .frame {
    position: relative;
    z-index: 1;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
  }

  /* ============================================================
     LEFT BOX — your own picture slideshow
     ============================================================ */
  .slideshow {
    position: relative;
    width: 40%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    margin-left: 6vw;
    overflow: hidden;
    border: 1px solid rgba(201,161,90,0.55);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    opacity: 0;
    animation: edgeIn 1.2s ease-out 0.4s forwards;
  }

  @keyframes edgeIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  .slideshow img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.4s ease-in-out;
  }

  .slideshow img.active {
    opacity: 1;
  }

  .slide-dots {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 2;
  }

  .slide-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 0.4s ease;
  }

  .slide-dots span.active {
    background: var(--gold);
  }

  /* ============================================================
     RIGHT — text
     ============================================================ */
  .panel {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 7vw;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    animation: rise 1s ease-out 0.6s forwards;
  }

  .main-text {
    margin-top: 18px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(46px, 6.2vw, 96px);
    line-height: 1.02;
  }

  .main-text span {
    display: inline-block;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .main-text .accent {
    color: var(--crimson);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .divider {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin-top: 34px;
    animation: expand 1.1s ease-out 1.9s forwards;
  }

  @keyframes expand { to { width: 180px; } }

  .sub {
    margin-top: 22px;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    animation: rise 1s ease-out 2.2s forwards;
  }

  @media (max-width: 820px) {
    .frame { flex-direction: column; justify-content: center; gap: 30px; }
    .slideshow { margin-left: 0; width: 70%; }
    .panel { padding: 0 8vw; align-items: flex-start; }
  }
</style>
</head>
<body>

  <!-- Rose background photo -->
  <div class="bg">
    <img src="https://images.unsplash.com/photo-1562690868-60bbe7293e94?fm=jpg&q=80&w=1600&auto=format&fit=crop" alt="Red rose">
  </div>

  <div class="frame">

    <!-- ============================================================
         PUT YOUR OWN PHOTOS HERE
         Add your picture files into the SAME FOLDER as this HTML file
         (or a subfolder like "images/"), then list them in the
         `slides` array inside the <script> at the bottom of this file.
         Example: "images/photo1.jpg", "images/photo2.jpg", ...
         ============================================================ -->
    <div class="slideshow" id="slideshow">
      <!-- <img> tags are generated automatically by the script below -->
      <div class="slide-dots" id="slideDots"></div>
    </div>

    <div class="panel">
      <div class="eyebrow">forever &amp; always</div>
      <div class="main-text" id="mainText"></div>
      <div class="divider"></div>
      <div class="sub">you have my heart, always</div>
    </div>

  </div>

  <script>
    /* ============================================================
       STEP 1: Put this HTML file and your picture files in the
       same project folder. Example folder structure:

         my-project/
         ├── i-love-you-slideshow.html   (this file)
         └── images/
             ├── photo1.jpg
             ├── photo2.jpg
             └── photo3.jpg

       STEP 2: List your image paths below, in the order you want
       them to appear. Use forward slashes, and match the exact
       filename (including capitalization and extension).
       ============================================================ */
    const slides = [
      "images/slide1.jpg",   // <-- replace with your picture
      "images/slide2.jpg",   // <-- replace with your picture
      "images/slide3.jpg"    // <-- add or remove lines as needed
    ];

    const SLIDE_DURATION = 4000; // milliseconds each photo stays visible

    const slideshowEl = document.getElementById('slideshow');
    const dotsEl = document.getElementById('slideDots');

    slides.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = "Our photo " + (i + 1);
      if (i === 0) img.classList.add('active');
      slideshowEl.insertBefore(img, dotsEl);

      const dot = document.createElement('span');
      if (i === 0) dot.classList.add('active');
      dotsEl.appendChild(dot);
    });

    let current = 0;
    const imgs = () => slideshowEl.querySelectorAll('img');
    const dots = () => dotsEl.querySelectorAll('span');

    setInterval(() => {
      const images = imgs();
      const dotEls = dots();
      if (images.length < 2) return;
      images[current].classList.remove('active');
      dotEls[current].classList.remove('active');
      current = (current + 1) % images.length;
      images[current].classList.add('active');
      dotEls[current].classList.add('active');
    }, SLIDE_DURATION);

    // Text reveal animation
    const text = "I love you Lovely \nAbellanida";
    const el = document.getElementById('mainText');
    let delay = 0.9;
    [...text].forEach((ch) => {
      if (ch === '\n') { el.appendChild(document.createElement('br')); return; }
      const span = document.createElement('span');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = delay + 's';
      delay += 0.055;
      el.appendChild(span);
    });
    const spans = el.querySelectorAll('span');
    Array.from(spans).slice(-3).forEach(s => s.classList.add('accent'));
  </script>

</body>
</html>
